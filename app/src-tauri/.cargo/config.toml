# Android cross-compilation linkers.
#
# Tauri 2.10.3 wires the linker for aarch64 but NOT for armv7 (the Rust triple is
# `armv7-linux-androideabi` while the NDK wrapper is `armv7A-linux-androideabi…`),
# so cargo falls back to `cc` and fails with "linker `cc` not found". Pinning the
# NDK clang wrappers here fixes every Android arch. Cargo only uses these when no
# `CARGO_TARGET_*_LINKER` env var is set, so it won't fight Tauri where Tauri does
# set one. Desktop builds are unaffected (these sections only apply to the Android
# targets).
#
# NOTE: these paths are machine-specific to this NDK install (r29, Windows). If
# the NDK version/location changes, update the paths. Don't commit this to a repo
# others build from.

[target.armv7-linux-androideabi]
linker = "C:/Users/LENOVO/AppData/Local/Android/Sdk/ndk/29.0.13846066/toolchains/llvm/prebuilt/windows-x86_64/bin/armv7a-linux-androideabi24-clang.cmd"

[target.aarch64-linux-android]
linker = "C:/Users/LENOVO/AppData/Local/Android/Sdk/ndk/29.0.13846066/toolchains/llvm/prebuilt/windows-x86_64/bin/aarch64-linux-android24-clang.cmd"

[target.i686-linux-android]
linker = "C:/Users/LENOVO/AppData/Local/Android/Sdk/ndk/29.0.13846066/toolchains/llvm/prebuilt/windows-x86_64/bin/i686-linux-android24-clang.cmd"

[target.x86_64-linux-android]
linker = "C:/Users/LENOVO/AppData/Local/Android/Sdk/ndk/29.0.13846066/toolchains/llvm/prebuilt/windows-x86_64/bin/x86_64-linux-android24-clang.cmd"
